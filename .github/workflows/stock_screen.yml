name: stock_screen (weekday 20:17 JST)
on:
  schedule:
    - cron: "17 11 * * 1-5"   # 20:17 JST Mon-Fri
    - cron: "30 15 * * 1-5"   # 00:30 JST Tue-Sat: catch up previous TSE session
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    concurrency:
      group: stock_screen_20jst
      cancel-in-progress: false
    steps:
      - name: Checkout (full history for branch ops)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # backtest.py が使う追加ライブラリ（requirements.txtに含まれていない場合のみ）
          pip install yfinance pandas numpy --quiet
          # JPX銘柄一覧URL障害時のフォールバック用
          pip install finance-datareader tokyo-stock-exchange xlwt --quiet

      - name: Resolve target TSE session
        id: target
        env:
          TZ: Asia/Tokyo
        run: |
          target="$(python - <<'PY'
          from run_stock_screen import resolve_expected_market_date
          print(resolve_expected_market_date().strftime('%Y-%m-%d'))
          PY
          )"
          echo "Target TSE session: ${target}"
          echo "date=${target}" >> "$GITHUB_OUTPUT"

      - name: Skip when target is already archived
        id: archived
        shell: bash
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: |
          set -euo pipefail
          rm -rf /tmp/stock_screen_existing
          git fetch origin data || true

          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git worktree add --detach /tmp/stock_screen_existing origin/data
            trap 'git worktree remove --force /tmp/stock_screen_existing 2>/dev/null || true' EXIT

            if [ -f "/tmp/stock_screen_existing/archive/${TARGET_DATE}/screen_${TARGET_DATE}_all.csv" ] \
              && [ -f "/tmp/stock_screen_existing/archive/${TARGET_DATE}/screen_${TARGET_DATE}_buy.csv" ] \
              && [ -f "/tmp/stock_screen_existing/archive/${TARGET_DATE}/screen_${TARGET_DATE}_sell.csv" ]; then
              echo "Target ${TARGET_DATE} is already archived; this run is a no-op."
              echo "exists=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Wait for Yahoo target-session bars
        id: readiness
        if: steps.archived.outputs.exists != 'true'
        shell: bash
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: |
          set +e
          python wait_for_market_data.py \
            --target-date "$TARGET_DATE" \
            --attempts 7 \
            --interval-seconds 300
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$rc" -eq 75 ]; then
            echo "::notice::Yahoo has not published ${TARGET_DATE} TSE daily bars yet. This run is deferred without error; the 00:30 JST catch-up run will try again."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Market-data readiness probe failed unexpectedly (rc=${rc})."
          exit "$rc"

      - name: Download data_e.xls (JPX with fallback)
        if: steps.archived.outputs.exists != 'true' && steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          JPX_URL="https://www.jpx.co.jp/english/markets/statistics-equities/misc/tvdivq0000001vg2-att/data_e.xls"
          rm -f data_e.xls

          if curl -fL --retry 3 --retry-delay 2 -o data_e.xls "$JPX_URL"; then
            echo "Downloaded JPX listing from the legacy URL."
          else
            echo "::warning::JPX legacy listing URL is unavailable; using fallback listing source."
            rm -f data_e.xls
          fi

          if python - <<'PY'
          from pathlib import Path
          p = Path("data_e.xls")
          if not p.is_file() or p.stat().st_size == 0:
              raise SystemExit(1)
          magic = p.read_bytes()[:8]
          if magic.startswith(b"\xd0\xcf\x11\xe0") or magic.startswith(b"PK\x03\x04"):
              raise SystemExit(0)
          raise SystemExit(1)
          PY
          then
            echo "JPX listing file signature is valid."
          else
            echo "::warning::JPX response is not an Excel file. Building a compatible listing file."
            python - <<'PY'
          import re
          import pandas as pd
          import xlwt

          def extract_codes(df):
              preferred = ["Symbol", "Code", "コード", "Local Code", "local_code", "ticker"]
              mapping = {str(c).strip().lower(): c for c in df.columns}
              col = None
              for name in preferred:
                  key = name.strip().lower()
                  if key in mapping:
                      col = mapping[key]
                      break
              if col is None:
                  col = df.columns[0]

              out = []
              for value in df[col].tolist():
                  text = str(value).strip()
                  m = re.fullmatch(r"(\d{4})(?:\.0)?", text)
                  if m:
                      out.append(m.group(1))
              return sorted(set(out))

          codes = []
          source = None

          try:
              import FinanceDataReader as fdr
              df = fdr.StockListing("TSE")
              codes = extract_codes(df)
              if len(codes) >= 2000:
                  source = "FinanceDataReader:TSE"
          except Exception as exc:
              print(f"FinanceDataReader fallback failed: {exc}")

          if len(codes) < 2000:
              try:
                  from tokyo_stock_exchange import tse
                  df = pd.read_csv(tse.csv_file_path)
                  codes = extract_codes(df)
                  if len(codes) >= 2000:
                      source = f"tokyo-stock-exchange:{tse.get_file_date()}"
              except Exception as exc:
                  print(f"tokyo-stock-exchange fallback failed: {exc}")

          if len(codes) < 2000:
              raise RuntimeError(f"Ticker fallback produced too few numeric TSE codes: {len(codes)}")

          book = xlwt.Workbook()
          sheet = book.add_sheet("Sheet1")
          sheet.write(0, 1, "Code")
          for row, code in enumerate(codes, start=1):
              sheet.write(row, 1, code)
          book.save("data_e.xls")
          print(f"Fallback listing source={source} numeric_codes={len(codes)}")
          PY
          fi

          file data_e.xls || true
          ls -l data_e.xls
          python - <<'PY'
          import pandas as pd
          s = pd.read_excel("data_e.xls", sheet_name="Sheet1", usecols="B", header=None).iloc[:, 0]
          codes = s.astype(str).str.strip().str.extract(r"(\d{4})", expand=False).dropna().unique().tolist()
          print(f"validated ticker codes: {len(codes)}")
          if len(codes) < 2000:
              raise RuntimeError(f"Validated ticker count is too small: {len(codes)}")
          PY

      - name: Run screen
        if: steps.archived.outputs.exists != 'true' && steps.readiness.outputs.ready == 'true'
        env:
          TZ: Asia/Tokyo
        run: |
          python run_stock_screen.py
          ls -la
          ls -la screen_*.csv || true

      - name: Upload CSV artifacts
        if: steps.archived.outputs.exists != 'true' && steps.readiness.outputs.ready == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: screen_csv_${{ github.run_id }}
          path: |
            screen_*.csv

      - name: Prepare fixed-holding signal history
        id: prepare_fixed_holding
        if: steps.archived.outputs.exists != 'true' && steps.readiness.outputs.ready == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf fixed_holding_input /tmp/stock_screen_data
          mkdir -p fixed_holding_input
          git fetch origin data
          git worktree add --detach /tmp/stock_screen_data origin/data
          trap 'git worktree remove --force /tmp/stock_screen_data 2>/dev/null || true' EXIT
          find /tmp/stock_screen_data/archive -mindepth 2 -maxdepth 2 -type f \
            -path '/tmp/stock_screen_data/archive/????-??-??/screen_*_buy.csv' \
            -exec cp -f {} fixed_holding_input/ \;
          cp -f screen_*_buy.csv fixed_holding_input/
          count="$(find fixed_holding_input -maxdepth 1 -name 'screen_*_buy.csv' | wc -l)"
          echo "Historical/current buy CSV count: ${count}"
          test "${count}" -gt 0

      - name: Warn when fixed-holding preparation failed
        if: steps.prepare_fixed_holding.outcome == 'failure'
        run: echo "::warning::Fixed-holding input preparation failed. Existing screen, backtest, and archive processing will continue."

      - name: Run fixed-holding backtests
        id: run_fixed_holding
        if: steps.prepare_fixed_holding.outcome == 'success'
        continue-on-error: true
        env:
          TZ: Asia/Tokyo
        run: |
          python fixed_holding_backtest.py --signals-dir fixed_holding_input \
            --score-min 8 --holdings 5 10 20 40 50 60 --signal-mode first_in_streak \
            --output-dir fixed_holding_report/first_in_streak
          python fixed_holding_backtest.py --signals-dir fixed_holding_input \
            --score-min 8 --holdings 5 10 20 40 50 60 --signal-mode all \
            --output-dir fixed_holding_report/all

      - name: Warn when fixed-holding backtest failed
        if: steps.run_fixed_holding.outcome == 'failure'
        run: echo "::warning::Fixed-holding backtest failed. Existing screen, backtest, and archive processing will continue."

      - name: Upload fixed-holding report
        uses: actions/upload-artifact@v6
        if: steps.archived.outputs.exists != 'true' && steps.readiness.outputs.ready == 'true' && always()
        with:
          name: fixed_holding_report_${{ github.run_id }}
          path: fixed_holding_report/
          if-no-files-found: warn
          retention-days: 30

      - name: Run backtest
        if: steps.archived.outputs.exists != 'true' && steps.readiness.outputs.ready == 'true'
        env:
          TZ: Asia/Tokyo
        run: |
          mkdir -p backtest_report
          RESULTS_DIR=. python backtest.py

      - name: Upload backtest report
        uses: actions/upload-artifact@v6
        if: steps.archived.outputs.exists != 'true' && steps.readiness.outputs.ready == 'true' && always()
        with:
          name: backtest_report_${{ github.run_id }}
          path: backtest_report/
          retention-days: 30

      - name: Archive CSVs to data branch
        if: steps.archived.outputs.exists != 'true' && steps.readiness.outputs.ready == 'true'
        shell: bash
        env:
          TZ: Asia/Tokyo
        run: |
          set -euo pipefail
          export TZ=Asia/Tokyo
          shopt -s nullglob
          all_files=(screen_*.csv)
          if [ ${#all_files[@]} -eq 0 ]; then
            echo "No screen_*.csv found. Existing files:"
            ls -la
            exit 1
          fi

          latest="$(printf '%s\n' "${all_files[@]}" | sort | tail -n 1)"
          day="${latest#screen_}"
          day="${day%%_*}"
          files=(screen_"${day}"_*.csv)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No CSV for day=${day}. Existing:"
            ls -la
            exit 1
          fi

          bt_html=""
          bt_files=(backtest_report/report_*.html backtest_report/trades_*.csv backtest_report/equity_*.csv)
          if [ ${#bt_files[@]} -gt 0 ]; then
            mkdir -p /tmp/backtest_report
            cp -f "${bt_files[@]}" /tmp/backtest_report/
            bt_html="found"
          fi

          fh_found=""
          rm -rf /tmp/fixed_holding_report
          if [ -d fixed_holding_report ] && find fixed_holding_report -type f -name '*.csv' -print -quit | grep -q .; then
            cp -a fixed_holding_report /tmp/fixed_holding_report
            fh_found="found"
          fi

          rm -rf /tmp/screen_csv
          mkdir -p /tmp/screen_csv
          cp -f "${files[@]}" /tmp/screen_csv/

          git fetch origin data || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git checkout -B data origin/data
          else
            git checkout -b data
          fi

          if [ -d "archive/${day}" ]; then
            new_screen=(/tmp/screen_csv/*.csv)
            existing_screen=(archive/"${day}"/screen_"${day}"_*.csv)

            if [ ${#new_screen[@]} -ne ${#existing_screen[@]} ]; then
              echo "::error::Archive collision for ${day}: screen CSV count differs."
              echo "new=${#new_screen[@]} existing=${#existing_screen[@]}"
              exit 1
            fi

            for src in "${new_screen[@]}"; do
              base="$(basename "$src")"
              dst="archive/${day}/${base}"
              if [ ! -f "$dst" ]; then
                echo "::error::Archive collision for ${day}: missing existing file ${base}"
                exit 1
              fi
              if ! cmp -s "$src" "$dst"; then
                echo "::error::Archive collision for ${day}: ${base} differs."
                echo "Existing archive will NOT be overwritten."
                exit 1
              fi
            done

            echo "archive/${day} already contains identical screen CSVs."
            echo "Archive operation is a no-op."
            exit 0
          fi

          mkdir -p "archive/${day}"
          cp -f /tmp/screen_csv/*.csv "archive/${day}/"

          if [ -n "$bt_html" ]; then
            mkdir -p "archive/${day}/backtest"
            cp -f /tmp/backtest_report/* "archive/${day}/backtest/"
          fi

          if [ -n "$fh_found" ]; then
            mkdir -p "archive/${day}/fixed_holding"
            cp -a /tmp/fixed_holding_report/. "archive/${day}/fixed_holding/"
          fi

          latest_src=(/tmp/screen_csv/*.csv)
          mkdir -p "archive/latest"
          for f in "${latest_src[@]}"; do
            base="$(basename "$f")"
            kind="${base#screen_${day}_}"
            kind="${kind%.csv}"
            cp -f "$f" "archive/latest/${kind}.csv"
          done

          if [ -n "$bt_html" ]; then
            mkdir -p "archive/latest/backtest"
            cp -f /tmp/backtest_report/* "archive/latest/backtest/"
          fi
          if [ -n "$fh_found" ]; then
            rm -rf "archive/latest/fixed_holding"
            mkdir -p "archive/latest/fixed_holding"
            cp -a /tmp/fixed_holding_report/. "archive/latest/fixed_holding/"
          fi

          git add -f archive
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "archive: ${day}" || echo "no changes"
          git push origin data
