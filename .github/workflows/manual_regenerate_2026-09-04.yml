name: regenerate 2026-09-04 with readiness guard
on:
  push:
    paths:
      - ".github/workflows/manual_regenerate_2026-09-04.yml"
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yfinance pandas numpy finance-datareader tokyo-stock-exchange xlwt --quiet

      - name: Confirm target is not already archived
        id: archived
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DATE="2026-09-04"
          rm -rf /tmp/stock_screen_existing
          git fetch origin data || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git worktree add --detach /tmp/stock_screen_existing origin/data
            trap 'git worktree remove --force /tmp/stock_screen_existing 2>/dev/null || true' EXIT
            if [ -f "/tmp/stock_screen_existing/archive/${TARGET_DATE}/screen_${TARGET_DATE}_all.csv" ] \
              && [ -f "/tmp/stock_screen_existing/archive/${TARGET_DATE}/screen_${TARGET_DATE}_buy.csv" ] \
              && [ -f "/tmp/stock_screen_existing/archive/${TARGET_DATE}/screen_${TARGET_DATE}_sell.csv" ]; then
              echo "Target ${TARGET_DATE} is already archived."
              echo "exists=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Check Yahoo 2026-09-04 readiness
        id: readiness
        if: steps.archived.outputs.exists != 'true'
        shell: bash
        run: |
          set +e
          python wait_for_market_data.py \
            --target-date 2026-09-04 \
            --attempts 7 \
            --interval-seconds 300
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$rc" -eq 75 ]; then
            echo "::notice::Yahoo has not published enough 2026-09-04 TSE daily bars yet. Regeneration is deferred without error."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Market-data readiness probe failed unexpectedly (rc=${rc})."
          exit "$rc"

      - name: Build compatible TSE listing
        if: steps.archived.outputs.exists != 'true' && steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          JPX_URL="https://www.jpx.co.jp/english/markets/statistics-equities/misc/tvdivq0000001vg2-att/data_e.xls"
          rm -f data_e.xls
          if curl -fL --retry 3 --retry-delay 2 -o data_e.xls "$JPX_URL"; then
            echo "Downloaded JPX listing."
          else
            rm -f data_e.xls
          fi

          if python - <<'PY'
          from pathlib import Path
          p = Path("data_e.xls")
          if not p.is_file() or p.stat().st_size == 0:
              raise SystemExit(1)
          magic = p.read_bytes()[:8]
          raise SystemExit(0 if magic.startswith(b"\xd0\xcf\x11\xe0") or magic.startswith(b"PK\x03\x04") else 1)
          PY
          then
            echo "JPX listing signature OK."
          else
            echo "JPX listing unavailable; using FinanceDataReader/TSE fallback."
            python - <<'PY'
          import re
          import pandas as pd
          import xlwt

          def extract_codes(df):
              preferred = ["Symbol", "Code", "コード", "Local Code", "local_code", "ticker"]
              mapping = {str(c).strip().lower(): c for c in df.columns}
              col = None
              for name in preferred:
                  key = name.strip().lower()
                  if key in mapping:
                      col = mapping[key]
                      break
              if col is None:
                  col = df.columns[0]
              out = []
              for value in df[col].tolist():
                  m = re.fullmatch(r"(\d{4})(?:\.0)?", str(value).strip())
                  if m:
                      out.append(m.group(1))
              return sorted(set(out))

          codes = []
          source = None
          try:
              import FinanceDataReader as fdr
              codes = extract_codes(fdr.StockListing("TSE"))
              if len(codes) >= 2000:
                  source = "FinanceDataReader:TSE"
          except Exception as exc:
              print(f"FinanceDataReader failed: {exc}")

          if len(codes) < 2000:
              from tokyo_stock_exchange import tse
              codes = extract_codes(pd.read_csv(tse.csv_file_path))
              source = f"tokyo-stock-exchange:{tse.get_file_date()}"

          if len(codes) < 2000:
              raise RuntimeError(f"too few ticker codes: {len(codes)}")

          book = xlwt.Workbook()
          sheet = book.add_sheet("Sheet1")
          sheet.write(0, 1, "Code")
          for row, code in enumerate(codes, start=1):
              sheet.write(row, 1, code)
          book.save("data_e.xls")
          print(f"listing source={source} codes={len(codes)}")
          PY
          fi

          python - <<'PY'
          import pandas as pd
          s = pd.read_excel("data_e.xls", sheet_name="Sheet1", usecols="B", header=None).iloc[:, 0]
          codes = s.astype(str).str.strip().str.extract(r"(\d{4})", expand=False).dropna().unique().tolist()
          print("validated codes:", len(codes))
          if len(codes) < 2000:
              raise RuntimeError("ticker validation failed")
          PY

      - name: Run 2026-09-04 stock screen
        if: steps.archived.outputs.exists != 'true' && steps.readiness.outputs.ready == 'true'
        env:
          TZ: Asia/Tokyo
        run: |
          python run_stock_screen.py
          ls -lh screen_2026-09-04_*.csv
          test -f screen_2026-09-04_all.csv
          test -f screen_2026-09-04_buy.csv
          test -f screen_2026-09-04_sell.csv

      - name: Upload 2026-09-04 CSV artifact
        if: steps.archived.outputs.exists != 'true' && steps.readiness.outputs.ready == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: screen_csv_2026-09-04_${{ github.run_id }}
          path: screen_2026-09-04_*.csv
          retention-days: 30

      - name: Run backtest
        if: steps.archived.outputs.exists != 'true' && steps.readiness.outputs.ready == 'true'
        env:
          TZ: Asia/Tokyo
        run: |
          mkdir -p backtest_report
          RESULTS_DIR=. python backtest.py

      - name: Archive 2026-09-04 to data branch
        if: steps.archived.outputs.exists != 'true' && steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DATE="2026-09-04"
          rm -rf /tmp/screen_csv /tmp/backtest_report_copy
          mkdir -p /tmp/screen_csv /tmp/backtest_report_copy
          cp -f screen_${TARGET_DATE}_*.csv /tmp/screen_csv/
          if [ -d backtest_report ]; then
            cp -f backtest_report/* /tmp/backtest_report_copy/ 2>/dev/null || true
          fi

          git fetch origin data || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git checkout -B data origin/data
          else
            git checkout -b data
          fi

          if [ -d "archive/${TARGET_DATE}" ]; then
            echo "archive/${TARGET_DATE} already exists; refusing overwrite."
            exit 1
          fi

          mkdir -p "archive/${TARGET_DATE}"
          cp -f /tmp/screen_csv/*.csv "archive/${TARGET_DATE}/"
          if find /tmp/backtest_report_copy -type f -print -quit | grep -q .; then
            mkdir -p "archive/${TARGET_DATE}/backtest"
            cp -f /tmp/backtest_report_copy/* "archive/${TARGET_DATE}/backtest/"
          fi

          mkdir -p archive/latest
          cp -f "/tmp/screen_csv/screen_${TARGET_DATE}_all.csv" archive/latest/all.csv
          cp -f "/tmp/screen_csv/screen_${TARGET_DATE}_buy.csv" archive/latest/buy.csv
          cp -f "/tmp/screen_csv/screen_${TARGET_DATE}_sell.csv" archive/latest/sell.csv

          git add -f archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "archive: ${TARGET_DATE} (regenerated with readiness guard)"
          git push origin data

      - name: Verify archived files
        if: steps.archived.outputs.exists != 'true' && steps.readiness.outputs.ready == 'true'
        run: |
          git fetch origin data
          for f in all buy sell; do
            git show "origin/data:archive/2026-09-04/screen_2026-09-04_${f}.csv" >/dev/null
            echo "verified archive/2026-09-04/screen_2026-09-04_${f}.csv"
          done
