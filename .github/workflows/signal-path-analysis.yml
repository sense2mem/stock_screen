name: Signal path analysis (manual)

on:
  workflow_dispatch:
    inputs:
      signal_mode:
        description: Signal selection mode
        required: true
        default: first_in_streak
        type: choice
        options:
          - first_in_streak
          - all
      score_min:
        description: Minimum signal score
        required: true
        default: "8"
        type: string
      horizon:
        description: Analysis horizon in trading days
        required: true
        default: "60"
        type: string
      first_peak_window:
        description: First-peak search window in trading days
        required: true
        default: "15"
        type: string
      pullback_end:
        description: Pullback-low search endpoint in trading days
        required: true
        default: "35"
        type: string
      first_rise_min_pct:
        description: Minimum first-rise percentage
        required: true
        default: "3.0"
        type: string
      pullback_min_pct:
        description: Minimum pullback percentage
        required: true
        default: "3.0"
        type: string
      pullback_max_pct:
        description: Maximum pullback percentage
        required: true
        default: "15.0"
        type: string
      breakout_margin_pct:
        description: Required breakout margin above first peak
        required: true
        default: "1.0"
        type: string
      lookback:
        description: Signal-date feature lookback in trading days
        required: true
        default: "120"
        type: string

permissions:
  contents: read

concurrency:
  group: signal-path-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile analysis programs
        run: |
          python -m py_compile signal_path_analysis.py
          python -m py_compile condition_signal_output.py
          python -m py_compile condition_backtest.py
          python -m py_compile condition_backtest_v2.py
          python -m py_compile condition_c_topix_analysis.py
          python -m py_compile condition_c_topix_analysis_yahoojp.py
          python -m py_compile topix_yahoo_jp.py

      - name: Prepare historical score8 signal files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf fixed_holding_input /tmp/stock_screen_data_signal_path
          mkdir -p fixed_holding_input

          git fetch origin data
          git worktree add --detach /tmp/stock_screen_data_signal_path origin/data
          trap 'git worktree remove --force /tmp/stock_screen_data_signal_path 2>/dev/null || true' EXIT

          find /tmp/stock_screen_data_signal_path/archive \
            -mindepth 2 \
            -maxdepth 2 \
            -type f \
            -path '/tmp/stock_screen_data_signal_path/archive/????-??-??/screen_*_buy.csv' \
            -exec cp -f {} fixed_holding_input/ \;

          count="$(find fixed_holding_input -maxdepth 1 -type f -name 'screen_*_buy.csv' | wc -l)"
          echo "Historical buy CSV count: ${count}"
          test "${count}" -gt 0

      - name: Run signal path analysis
        env:
          TZ: Asia/Tokyo
          SIGNAL_MODE: ${{ inputs.signal_mode }}
          SCORE_MIN: ${{ inputs.score_min }}
          HORIZON: ${{ inputs.horizon }}
          FIRST_PEAK_WINDOW: ${{ inputs.first_peak_window }}
          PULLBACK_END: ${{ inputs.pullback_end }}
          FIRST_RISE_MIN_PCT: ${{ inputs.first_rise_min_pct }}
          PULLBACK_MIN_PCT: ${{ inputs.pullback_min_pct }}
          PULLBACK_MAX_PCT: ${{ inputs.pullback_max_pct }}
          BREAKOUT_MARGIN_PCT: ${{ inputs.breakout_margin_pct }}
          LOOKBACK: ${{ inputs.lookback }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf signal_path_report

          python signal_path_analysis.py \
            --signals-dir fixed_holding_input \
            --signal-pattern 'screen_*_buy.csv' \
            --score-min "$SCORE_MIN" \
            --signal-mode "$SIGNAL_MODE" \
            --output-dir signal_path_report \
            --horizon "$HORIZON" \
            --first-peak-window "$FIRST_PEAK_WINDOW" \
            --pullback-end "$PULLBACK_END" \
            --first-rise-min-pct "$FIRST_RISE_MIN_PCT" \
            --pullback-min-pct "$PULLBACK_MIN_PCT" \
            --pullback-max-pct "$PULLBACK_MAX_PCT" \
            --breakout-margin-pct "$BREAKOUT_MARGIN_PCT" \
            --lookback "$LOOKBACK"

          cat > signal_path_report/analysis_parameters.txt <<EOF
          repository=${GITHUB_REPOSITORY}
          ref=${GITHUB_REF}
          sha=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          signal_mode=${SIGNAL_MODE}
          score_min=${SCORE_MIN}
          horizon=${HORIZON}
          first_peak_window=${FIRST_PEAK_WINDOW}
          pullback_end=${PULLBACK_END}
          first_rise_min_pct=${FIRST_RISE_MIN_PCT}
          pullback_min_pct=${PULLBACK_MIN_PCT}
          pullback_max_pct=${PULLBACK_MAX_PCT}
          breakout_margin_pct=${BREAKOUT_MARGIN_PCT}
          lookback=${LOOKBACK}
          condition_a=pullback_from_60d_high_pct<=-12
          condition_b=condition_a and ma20_distance_pct>=1
          condition_c=ma20_distance_pct>=1 and di_spread>=3
          condition_c_signal_day_source=conventional_score8_signal_features
          condition_backtest_entry=next_trading_day_open_after_first_occurrence
          condition_backtest_holdings=5,10,20,40,50,60
          condition_backtest_max_trigger_days=60
          condition_backtest_current_day=excluded_before_15:30_JST
          condition_backtest_summary=deduplicated_by_ticker_condition_entry_date
          condition_c_strategy_stop_loss_pct=14
          condition_c_strategy_exit=stop_loss_or_60th_trading_day_close
          condition_c_benchmark=TOPIX_998405.T
          condition_c_benchmark_source=Yahoo_Finance_Japan_history_page
          condition_c_benchmark_period=entry_day_open_to_actual_strategy_exit_day_close
          EOF

          ls -lh signal_path_report

      - name: Write analysis summary
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd

          report = Path("signal_path_report")
          detail = pd.read_csv(report / "signal_path_detail.csv", encoding="utf-8-sig")
          features = pd.read_csv(report / "signal_features.csv", encoding="utf-8-sig")
          status = pd.read_csv(report / "signal_path_status.csv", encoding="utf-8-sig")
          counts = detail["path_label"].value_counts(dropna=False)
          stages = features["pattern_stage"].value_counts(dropna=False)
          lines = [
              "# Signal path analysis", "",
              f"- Signals analyzed: **{len(detail)}**",
              f"- DOUBLE_RISE_SUCCESS: **{int(counts.get('DOUBLE_RISE_SUCCESS', 0))}**",
              f"- In progress / non-closed status rows: **{len(status)}**", "",
              "## Price-path classifications", "", "| Classification | Count |", "|---|---:|",
          ]
          lines.extend(f"| {label} | {int(count)} |" for label, count in counts.items())
          lines.extend(["", "## Signal-date pattern stages", "", "| Pattern stage | Count |", "|---|---:|"])
          lines.extend(f"| {label} | {int(count)} |" for label, count in stages.items())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Create condition A-C signal output
        shell: bash
        run: |
          python condition_signal_output.py \
            --features signal_path_report/signal_features.csv \
            --output signal_path_report/condition_signals.csv \
            --condition-c-output signal_path_report/condition_c_signal_day.csv \
            --github-summary "$GITHUB_STEP_SUMMARY"
          ls -lh \
            signal_path_report/condition_signals.csv \
            signal_path_report/condition_c_signal_day.csv

      - name: Run confirmed condition A-C first-occurrence backtest
        env:
          TZ: Asia/Tokyo
          SIGNAL_MODE: ${{ inputs.signal_mode }}
          SCORE_MIN: ${{ inputs.score_min }}
          LOOKBACK: ${{ inputs.lookback }}
        shell: bash
        run: |
          set -euo pipefail
          python condition_backtest_v2.py \
            --signals-dir fixed_holding_input \
            --signal-pattern 'screen_*_buy.csv' \
            --score-min "$SCORE_MIN" \
            --signal-mode "$SIGNAL_MODE" \
            --output-dir signal_path_report \
            --path-detail signal_path_report/signal_path_detail.csv \
            --lookback "$LOOKBACK" \
            --max-trigger-days 60 \
            --github-summary "$GITHUB_STEP_SUMMARY"

          ls -lh \
            signal_path_report/condition_backtest_detail.csv \
            signal_path_report/condition_backtest_unique_entries.csv \
            signal_path_report/condition_backtest_summary.csv \
            signal_path_report/condition_average_price_curve.csv \
            signal_path_report/condition_backtest_status.csv

      - name: Compare conventional condition C strategy with TOPIX
        env:
          TZ: Asia/Tokyo
        shell: bash
        run: |
          set -euo pipefail
          python condition_c_topix_analysis_yahoojp.py \
            --signals signal_path_report/condition_c_signal_day.csv \
            --output-dir signal_path_report \
            --benchmark-ticker '998405.T' \
            --stop-loss-pct 14 \
            --holding-days 60 \
            --github-summary "$GITHUB_STEP_SUMMARY"

          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          report = Path("signal_path_report")
          detail = pd.read_csv(report / "condition_c_topix_detail.csv", encoding="utf-8-sig")
          matured = detail[detail["strategy_return_pct"].notna()]
          completed = detail[detail["status"].eq("CLOSED")]
          print("TOPIX benchmark ticker: 998405.T")
          print("TOPIX source: Yahoo Finance Japan history page")
          print(f"Matured strategy trades: {len(matured)}")
          print(f"Completed benchmark comparisons: {len(completed)}")
          if len(matured) > 0 and len(completed) == 0:
              statuses = detail.loc[matured.index, "status"].value_counts().to_dict()
              raise RuntimeError(f"TOPIX comparison produced zero completed rows: {statuses}")
          PY

          ls -lh \
            signal_path_report/condition_c_topix_detail.csv \
            signal_path_report/condition_c_topix_summary.csv

      - name: Upload signal path report
        uses: actions/upload-artifact@v6
        with:
          name: signal_path_report_${{ inputs.signal_mode }}_${{ github.run_id }}
          path: signal_path_report/
          if-no-files-found: error
          retention-days: 30
