name: regenerate 2026-09-04 after earnings-date fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/regenerate_2026-09-04_earnings_fix.yml"
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install finance-datareader tokyo-stock-exchange xlwt --quiet

      - name: Build compatible TSE listing
        shell: bash
        run: |
          set -euo pipefail
          JPX_URL="https://www.jpx.co.jp/english/markets/statistics-equities/misc/tvdivq0000001vg2-att/data_e.xls"
          rm -f data_e.xls

          if curl -fL --retry 3 --retry-delay 2 -o data_e.xls "$JPX_URL"; then
            echo "Downloaded JPX listing."
          else
            rm -f data_e.xls
          fi

          if python - <<'PY'
          from pathlib import Path
          p = Path("data_e.xls")
          if not p.is_file() or p.stat().st_size == 0:
              raise SystemExit(1)
          magic = p.read_bytes()[:8]
          raise SystemExit(0 if magic.startswith(b"\xd0\xcf\x11\xe0") or magic.startswith(b"PK\x03\x04") else 1)
          PY
          then
            echo "JPX listing signature OK."
          else
            echo "JPX listing unavailable; using fallback."
            python - <<'PY'
          import re
          import pandas as pd
          import xlwt

          def extract_codes(df):
              preferred = ["Symbol", "Code", "コード", "Local Code", "local_code", "ticker"]
              mapping = {str(c).strip().lower(): c for c in df.columns}
              col = next((mapping[n.lower()] for n in preferred if n.lower() in mapping), df.columns[0])
              out = []
              for value in df[col].tolist():
                  m = re.fullmatch(r"(\d{4})(?:\.0)?", str(value).strip())
                  if m:
                      out.append(m.group(1))
              return sorted(set(out))

          codes = []
          source = None
          try:
              import FinanceDataReader as fdr
              codes = extract_codes(fdr.StockListing("TSE"))
              if len(codes) >= 2000:
                  source = "FinanceDataReader:TSE"
          except Exception as exc:
              print(f"FinanceDataReader failed: {exc}")

          if len(codes) < 2000:
              from tokyo_stock_exchange import tse
              codes = extract_codes(pd.read_csv(tse.csv_file_path))
              source = f"tokyo-stock-exchange:{tse.get_file_date()}"

          if len(codes) < 2000:
              raise RuntimeError(f"too few ticker codes: {len(codes)}")

          book = xlwt.Workbook()
          sheet = book.add_sheet("Sheet1")
          sheet.write(0, 1, "Code")
          for row, code in enumerate(codes, start=1):
              sheet.write(row, 1, code)
          book.save("data_e.xls")
          print(f"listing source={source} codes={len(codes)}")
          PY
          fi

          python - <<'PY'
          import pandas as pd
          s = pd.read_excel("data_e.xls", sheet_name="Sheet1", usecols="B", header=None).iloc[:, 0]
          codes = s.astype(str).str.strip().str.extract(r"(\d{4})", expand=False).dropna().unique().tolist()
          print("validated codes:", len(codes))
          if len(codes) < 2000:
              raise RuntimeError("ticker validation failed")
          PY

      - name: Regenerate fixed 2026-09-04 session
        env:
          TZ: Asia/Tokyo
        run: |
          python - <<'PY'
          import pandas as pd
          import run_stock_screen as runner

          runner.resolve_expected_market_date = lambda now=None: pd.Timestamp("2026-09-04")
          runner.main()
          PY

          ls -lh screen_2026-09-04_*.csv
          test -f screen_2026-09-04_all.csv
          test -f screen_2026-09-04_buy.csv
          test -f screen_2026-09-04_sell.csv

      - name: Verify 1982.T corrected earnings fields
        run: |
          python - <<'PY'
          import pandas as pd

          path = "screen_2026-09-04_buy.csv"
          df = pd.read_csv(path)
          row = df.loc[df["ticker"].astype(str).eq("1982.T")]
          if row.empty:
              raise RuntimeError("1982.T is missing from regenerated buy CSV")

          r = row.iloc[0]
          earnings = pd.to_datetime(r["next_earn_date"], errors="coerce")
          days = pd.to_numeric(pd.Series([r["days_to_earnings"]]), errors="coerce").iloc[0]
          source = str(r.get("earn_date_source", ""))
          raw_stale = str(r.get("earn_date_raw_stale", ""))
          lookup_error = str(r.get("earn_date_lookup_error", ""))

          print("ticker:", r["ticker"])
          print("next_earn_date:", earnings.date() if pd.notna(earnings) else None)
          print("days_to_earnings:", days)
          print("earn_date_source:", source)
          print("earn_date_raw_stale:", raw_stale)
          print("earn_date_lookup_error:", lookup_error)

          if pd.isna(earnings) or earnings < pd.Timestamp("2026-09-04"):
              raise RuntimeError("next_earn_date is not a valid future date")
          if earnings != pd.Timestamp("2026-11-11"):
              raise RuntimeError(f"unexpected 1982.T earnings date: {earnings}")
          if pd.isna(days) or int(days) != 48:
              raise RuntimeError(f"unexpected days_to_earnings: {days}")
          if not source or source == "unknown":
              raise RuntimeError("earn_date_source is unknown")
          PY

      - name: Upload corrected CSVs
        uses: actions/upload-artifact@v6
        with:
          name: screen_csv_2026-09-04_earnings_fix_${{ github.run_id }}
          path: screen_2026-09-04_*.csv
          retention-days: 30

      - name: Backup old archive and replace Sep 4 CSVs
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DATE="2026-09-04"

          rm -rf /tmp/new_screen
          mkdir -p /tmp/new_screen
          cp -f screen_${TARGET_DATE}_all.csv /tmp/new_screen/
          cp -f screen_${TARGET_DATE}_buy.csv /tmp/new_screen/
          cp -f screen_${TARGET_DATE}_sell.csv /tmp/new_screen/

          git fetch origin data
          git checkout -B data origin/data

          OLD_DIR="archive/${TARGET_DATE}/pre-earnings-date-fix"
          mkdir -p "$OLD_DIR"
          for kind in all buy sell; do
            src="archive/${TARGET_DATE}/screen_${TARGET_DATE}_${kind}.csv"
            if [ -f "$src" ] && [ ! -f "$OLD_DIR/screen_${TARGET_DATE}_${kind}.csv" ]; then
              cp -f "$src" "$OLD_DIR/"
            fi
          done

          mkdir -p "archive/${TARGET_DATE}"
          cp -f /tmp/new_screen/screen_${TARGET_DATE}_all.csv "archive/${TARGET_DATE}/"
          cp -f /tmp/new_screen/screen_${TARGET_DATE}_buy.csv "archive/${TARGET_DATE}/"
          cp -f /tmp/new_screen/screen_${TARGET_DATE}_sell.csv "archive/${TARGET_DATE}/"

          mkdir -p archive/latest
          cp -f /tmp/new_screen/screen_${TARGET_DATE}_all.csv archive/latest/all.csv
          cp -f /tmp/new_screen/screen_${TARGET_DATE}_buy.csv archive/latest/buy.csv
          cp -f /tmp/new_screen/screen_${TARGET_DATE}_sell.csv archive/latest/sell.csv

          git add -f "archive/${TARGET_DATE}" archive/latest/all.csv archive/latest/buy.csv archive/latest/sell.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No archive changes detected."
          else
            git commit -m "archive: correct 2026-09-04 earnings dates"
            git push origin data
          fi

      - name: Verify corrected data branch archive
        run: |
          git fetch origin data
          git checkout -B data origin/data
          python - <<'PY'
          import pandas as pd

          path = "archive/2026-09-04/screen_2026-09-04_buy.csv"
          df = pd.read_csv(path)
          r = df.loc[df["ticker"].astype(str).eq("1982.T")].iloc[0]
          earnings = pd.to_datetime(r["next_earn_date"], errors="coerce")
          days = int(pd.to_numeric(r["days_to_earnings"]))
          source = str(r.get("earn_date_source", ""))

          print("ARCHIVE VERIFIED")
          print("1982.T next_earn_date=", earnings.date())
          print("1982.T days_to_earnings=", days)
          print("1982.T earn_date_source=", source)

          assert earnings == pd.Timestamp("2026-11-11")
          assert days == 48
          assert source and source != "unknown"
          PY
